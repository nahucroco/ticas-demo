    <div class="container-selects" style="padding: 0 16px;">

                                stroke="white" stroke-width="1.5" />
                            <path d="M7 4V2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" />

                            <path
                                d="M18 13C18 13.5523 17.5523 14 17 14C16.4477 14 16 13.5523 16 13C16 12.4477 16.4477 12 17 12C17.5523 12 18 12.4477 18 13Z"

                            <path
                                d="M13 17C13 17.5523 12.5523 18 12 18C11.4477 18 11 17.5523 11 17C11 16.4477 11.4477 16 12 16C12.5523 16 13 16.4477 13 17Z"

                    <input type="text" id="fecha" class="input-fecha-custom input-custom form-control input con-valor"

                </div>
            </div>
            <div class="campo-hora d-flex flex-row w-100 justify-content-between">
                <label for="hora" class="label-hora texto-transparente">Hora</label>
                <div class="selector-hora">
                    <span class="container-icono"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"

    <button id="btn-anterior" type="button" class="btn-secundario">
        <p class="M-boton">Volver</p>
    </button>
    <button id="btn-siguiente" type="button" class="btn-primario btn-disabled" disabled>
        <p class="M-boton">Siguiente</p>
    </button>
</div>

<script>
    
</script>

<script>
    const STORAGE_FECHA = 'partidoAmistoso_fecha';
    const STORAGE_HORA = 'partidoAmistoso_hora';
    const STORAGE_DURACION = 'partidoAmistoso_duracion';
    const maximo = 240;
    const paso = 30;
    let minutos = 0;
    let fechaAltInput = null;

    window.addEventListener("DOMContentLoaded", () => {
        const fechaGuardada = localStorage.getItem(STORAGE_FECHA);
        const defaultFecha = fechaGuardada || new Date(); // Hoy por defecto
        const horaGuardada = localStorage.getItem(STORAGE_HORA);
        const defaultHora = horaGuardada || "20:00";

        // Setear valor por defecto en el input
        document.getElementById("hora").value = defaultHora;
        localStorage.setItem(STORAGE_HORA, defaultHora); // opcional

        if (defaultHora) {
            document.getElementById("hora").classList.add("con-valor");
        }

        const picker = flatpickr("#fecha", {
            altInput: true,
            altFormat: "d / M / y",
            dateFormat: "Y-m-d",
            locale: "es",
            disableMobile: true,
            minDate: "today",
            defaultDate: defaultFecha,
            onChange: function (selectedDates, dateStr) {
                localStorage.setItem(STORAGE_FECHA, dateStr);
                const inputShowed = document.getElementsByClassName("input-fecha-custom")[1];
                inputShowed?.classList.toggle("con-valor", !!dateStr);
                validarCampos();
            }
        });
        if (!fechaGuardada && picker.selectedDates.length) {
            const dateStr = picker.input.value;
            localStorage.setItem(STORAGE_FECHA, dateStr);
        }

        if (fechaGuardada) {
            picker.setDate(fechaGuardada, true);
        }

        const hora = localStorage.getItem(STORAGE_HORA);
        const duracion = parseInt(localStorage.getItem(STORAGE_DURACION)) || 0;

        if (hora) {
            const horaInput = document.getElementById("hora");
            horaInput.value = hora;
            horaInput.classList.add("con-valor");  // ← lo que hacía actualizarEstilo
        }

        if (duracion > 0 && duracion <= maximo) {
            minutos = duracion;
            actualizar();
        }

        validarCampos();
    });
    flatpickr("#hora", {
        enableTime: true,
        noCalendar: true,
        dateFormat: "H:i",
        time_24hr: true,
        minuteIncrement: 30,
        locale: "es",
        disableMobile: true,
        onChange: function () {
            const input = document.getElementById("hora");
            if (input.value) {
                input.classList.add("con-valor");
            } else {
                input.classList.remove("con-valor");
            }
            validarCampos();
        }
    });

    function actualizar() {
        const valor = document.getElementById("valor-duracion");
        valor.textContent = `${minutos} minutos`;
        if (minutos === 0) {
            valor.classList.add('bg-cero');
            valor.classList.remove('bg-activo');
        } else {
            valor.classList.add('bg-activo');
            valor.classList.remove('bg-cero');
        }
        validarCampos();
    }

    document.getElementById("sumar").addEventListener("click", () => {
        if (minutos + paso <= maximo) {
            minutos += paso;
            actualizar();
            localStorage.setItem(STORAGE_DURACION, minutos);
        }
    });

    document.getElementById("restar").addEventListener("click", () => {
        if (minutos >= paso) {
            minutos -= paso;
            actualizar();
            localStorage.setItem(STORAGE_DURACION, minutos);
        }
    });

    function validarCampos() {
        const fecha = document.getElementById("fecha").value.trim();
        const hora = document.getElementById("hora").value.trim();
        const btnSiguiente = document.getElementById("btn-siguiente");
        const validado = fecha !== "" && hora !== "" && minutos > 0 && fechaHoraValida();
        btnSiguiente.disabled = !validado;
        btnSiguiente.classList.toggle("btn-disabled", !validado);
    }

    document.getElementById("fecha").addEventListener("change", () => {
        /* localStorage.setItem(STORAGE_FECHA, document.getElementById("fecha").value); */
        const fechaISO = document.getElementById("fecha").value;
        localStorage.setItem(STORAGE_FECHA, fechaISO);
    });

    document.getElementById("hora").addEventListener("change", () => {
        localStorage.setItem(STORAGE_HORA, document.getElementById("hora").value);
    });

    document.getElementById("btn-anterior").addEventListener("click", () => {
        window.location.href = "{% url 'crear_partido_1' %}";
    });

    document.getElementById("btn-siguiente").addEventListener("click", () => {
        if (!document.getElementById("btn-siguiente").disabled) {
            window.location.href = "{% url 'crear_partido_3' %}";
        }
    });

    const fechaHoraValida = () => {
        const fecha = document.getElementById("fecha").value.trim();
        const hora = document.getElementById("hora").value.trim();

        if (!fecha || !hora || minutos <= 0) return false;

        const ahora = new Date();
        const [h, m] = hora.split(":").map(Number);

        const fechaSeleccionada = new Date(`${fecha}T${hora}`);
        const fechaMinima = new Date(ahora.getTime() + 15 * 60 * 1000);  // ahora + 15 min

        return fechaSeleccionada >= fechaMinima;
    };

</script>
{% endblock %}
