{% extends 'app_torneo_f5/base.html' %}
{% load static %}

{% block head %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/varcolors.css' %}">
<link rel="stylesheet" href="{% static 'css/crear_partido.css' %}">
<link rel="stylesheet" href="{% static 'css/crear_partido_custom.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
{% endblock %}

{% block title %}Ticas - Partidos{% endblock %}

{% block content %}

<style>
  .container-general {
    display: flex;
width: 328px;
flex-direction: column;
justify-content: center;
align-items: flex-start;
gap: -54px;

  }

  .input-container {
    display: flex;
padding: 13px 10px;
justify-content: flex-end;
align-items: center;
gap: 10px;
align-self: stretch;
border-radius: 5px;
background: #373639;
  }
    .input-container input {

background: #373639;
  }
</style>

<div class="main">
  <div class="container-titulo">
    <p class="M-subtitulos">Creando partido amistoso</p>
  </div>

  <div class="container-progress">
    <div class="circle-container">
      <div class="circle-progress" id="progressCircle"></div>
      <div class="M-titulo circle-center" id="circleLabel">1/3</div>
    </div>
  </div>

  <div class="container-general">

    <div class="container-placeholder">
      <p>Cancha</p>
    </div>
    <div class="input-container">
      <input type="text" placeholder="Cancha" class="input-text">
      <div>
        <svg width="2" height="24" viewBox="0 0 2 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 0L0.999999 24" stroke="#733BDE"/>
        </svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 9L12 15L5 9" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

      </div>
    </div>

  </div>


<div class="footer-boton">
  <button class="btn-primario" id="btnCrearPartido2">
    <p class="M-boton">Siguiente</p>
  </button>
</div>

{% endblock %}
