{% extends 'app_torneo_f5/base.html' %}
{% load static %}

{% block head %}
{{ block.super }}
<style>
    body {
        background-color: #161618 !important;
        padding: 25px 16px 0 16px;
        height: 100dvh;
    }

    .pantalla-crear {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .container-1 {
        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 8px;
    }

    .container-1 label {
        margin-left: 10px;
        font-size: 16px;
        font-weight: 400;
        font-style: normal;
    }

    .container-1 label p {
        opacity: 0.5;
        font-size: 16px;
        font-weight: 400;
        font-style: normal;
    }

    .input-custom {
        border: none;
        background-color: #373639;
        color: white;
        font-size: 16px;
        cursor: pointer;
        flex: 1;
        padding: 13px 10px 13px 50px;
        border-radius: 5px;
        width: 160px;
    }

    .input-custom::placeholder {
        color: #FFF !important;
    }

    .input-custom.con-valor {
        background-color: #3F374E;
        color: white;
    }

    .input-custom:focus {
        outline: none;
        border: none;
        box-shadow: none;
    }

    .campo-fecha {
        width: 100%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
    }

    .selector-fecha {
        position: relative;
    }

    .selector-hora {
        position: relative;
    }

    .container-icono {
        position: absolute;
        margin-top: 8px;
        margin-left: 13px;
        pointer-events: none;
        color: white;
        font-size: 18px;
        z-index: 1;
    }

    .flatpickr-input::placeholder {
        color: #FFF !important;
    }

    .input-custom.form-control.input.active {
        background-color: #3F374E !important;
    }

    .input-text {
        width: 100%;
        background-color: #373639;
        color: white;
        font-size: 16px;
        padding: 13px 10px;
        border-radius: 5px;
        border: none;
        margin-bottom: 10px;
    }

    .input-text:focus {
        outline: none;
        border: none;
        box-shadow: none;
    }

    input.con-valor {
        background-color: #3F374E;
    }

    .container-posicion {
        background: #3F374E;
        padding: 10px;
        border-radius: 5px;
        width: 308px;
        gap: 10px;
        cursor: pointer;
    }

    .icono-posicion {
        width: 24px;
        height: 25px;
        flex-shrink: 0;
    }

    .checkbox-wrapper {
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        position: relative;
    }

    .checkbox-wrapper input[type="checkbox"] {
        opacity: 0;
        position: absolute;
        width: 0;
        height: 0;
    }

    .custom-checkbox {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        background-color: #3F374E;
        border: 2px solid #FFF;
        transition: background-color 0.2s ease, box-shadow 0.2s ease;
        display: inline-block;
        position: relative;
    }

    .checkbox-wrapper input[type="checkbox"]:checked+.custom-checkbox {
        background-color: #FFF;
    }

    .checkbox-wrapper input[type="checkbox"]:checked+.custom-checkbox::after {
        content: "";
        position: absolute;
        left: 7px;
        top: 3px;
        width: 5px;
        height: 10px;
        border: solid #161618;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .btn-disabled {
        background-color: #5E605E !important;
        color: #ffffff50 !important;
        cursor: initial !important;
    }

    .container-botones button {
        width: 49% !important;
    }

    .container-posicion.selected {
        background-color: #733BDE;
        /* rosa fuerte */
    }
    
</style>
<link rel="stylesheet" href="{% static 'css/varcolors.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/es.js"></script>
{% endblock %}
{% block content %}

    <div class="conainer-main">

                    <input type="checkbox" name="pie_preferido" id="checkbox-delantero" value="Amb" {% if jugador.pie_preferido == 'Amb' %}checked{% endif %}/>

    <input type="hidden" name="pie_preferido" id="input-pie-preferido">
    <input type="hidden" name="posicion_preferida" value="{{ request.user.jugador.posicion_preferida }}">
    <input type="hidden" name="nombre" value="{{ request.user.jugador.nombre }}">
    <input type="hidden" name="fecha_nacimiento" value="{{ request.user.jugador.fecha_nacimiento|date:'Y-m-d' }}">
    <div class="container-botones w-100 d-flex justify-content-end align-items-end"
        style="padding-bottom: 25px; gap: 2%;">
        <button type="button" class="btn-secundario" style="color: #4F9639;" id="btnAnterior">Anterior</button>
        <button class="btn-primario btn-disabled" style="color: #FFF;" id="btnSiguiente">Siguiente</button>
    </div>

</form>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const contenedores = document.querySelectorAll('.container-posicion');
        const checkboxes = document.querySelectorAll('input[type="checkbox"][name="pie_preferido"]');
        const botonSiguiente = document.getElementById('btnSiguiente');
        const botonAnterior = document.getElementById('btnAnterior');
        const inputPie = document.getElementById('input-pie-preferido');
        const marcado = document.querySelector('input[name="pie_preferido"]:checked');
        
        botonSiguiente.disabled = true;
        botonSiguiente.classList.add('disabled');

        if (marcado) {
          inputPie.value = marcado.value;
          botonSiguiente.disabled = false;
          botonSiguiente.classList.remove('btn-disabled');
        }

        contenedores.forEach(container => {
            container.addEventListener('click', function () {
                checkboxes.forEach(cb => cb.checked = false);

                // Desmarcar clases seleccionadas
                contenedores.forEach(c => c.classList.remove('selected'));

                const checkbox = container.querySelector('input[type="checkbox"]');
                checkbox.checked = true;

                // Agregar clase seleccionada
                container.classList.add('selected');

                // Guardar en el input hidden
                inputPie.value = checkbox.value;

                // Activar botón
                botonSiguiente.disabled = false;
                botonSiguiente.classList.remove('btn-disabled');
            });
        });

        botonSiguiente.addEventListener('click', () => {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '';

            // CSRF
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            const csrfInput = document.createElement('input');
            csrfInput.type = 'hidden';
            csrfInput.name = 'csrfmiddlewaretoken';
            csrfInput.value = csrfToken;
            form.appendChild(csrfInput);

            // Pie preferido
            const pieInput = document.createElement('input');
            pieInput.type = 'hidden';
            pieInput.name = 'pie_preferido';
            pieInput.value = inputPie.value;
            form.appendChild(pieInput);

            document.body.appendChild(form);
            form.submit();
        });

        botonAnterior.addEventListener('click', () => {
            window.location.href = "{% url 'crear_perfil_2' %}";
        });
    });

</script>
{% endblock %}
