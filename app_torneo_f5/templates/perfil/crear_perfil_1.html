{% block head %}
{{ block.super }}
<style>
    body {
        background-color: #161618 !important;
        padding: 25px 16px;
        height: 100dvh;
    }

    .pantalla-crear {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .container-1 {
        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 8px;
    }

    .container-1 label {
        margin-left: 10px;
        font-size: 16px;
        font-weight: 400;
        font-style: normal;
    }

    .container-1 label p {
        opacity: 0.5;
        font-size: 16px;
        font-weight: 400;
        font-style: normal;
    }

    .input-custom {
        border: none;
        background-color: #373639;
        color: white;
        font-size: 16px;
        cursor: pointer;
        flex: 1;
        padding: 13px 10px 13px 50px;
        border-radius: 5px;
        width: 160px;
    }

    .input-custom::placeholder {
        color: #FFF !important;
    }

    .input-custom.con-valor {
        background-color: #3F374E;
        color: white;
    }

    .input-custom:focus {
        outline: none;
        border: none;
        box-shadow: none;
    }

    input:-internal-autofill-selected {
        background-color: #3F374E !important;
        color: white !important;
    }

    .campo-fecha {
        width: 100%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
    }

    .selector-fecha {
        position: relative;
    }

    .selector-hora {
        position: relative;
    }

    .container-icono {
        position: absolute;
        margin-top: 8px;
        margin-left: 13px;
        pointer-events: none;
        color: white;
        font-size: 18px;
        z-index: 1;
    }

    .flatpickr-input::placeholder {
        color: #FFF !important;
    }

    .input-custom.form-control.input.active {
        background-color: #3F374E !important;
    }

    .input-text {
        width: 100%;
        background-color: #373639;
        color: white;
        font-size: 16px;
        padding: 13px 10px;
        border-radius: 5px;
        border: none;
        margin-bottom: 10px;
    }

    .input-text:focus {
        outline: none;
        border: none;
        box-shadow: none;
    }

    input.con-valor {
        background-color: #3F374E;
    }

    .btn-disabled {
        background-color: #5E605E !important;
        color: #ffffff50 !important;
        cursor: initial !important;
    }

    input:-webkit-autofill {
        background-color: #3F374E !important;
        -webkit-box-shadow: 0 0 0 1000px #3F374E inset !important;
        -webkit-text-fill-color: white !important;
        caret-color: white !important;
        border-radius: 5px !important;
        transition: background-color 5000s ease-in-out 0s;
    }


    input:-internal-autofill-selected {
        background-color: #3F374E !important;
        color: white !important;
    }

    /* Contenedor del campo con label flotante */
    .campo {
        position: relative;
        width: 100%;
    }

    /* Label flotante generado dinámicamente a partir del placeholder */
    .label-flotante {
        position: absolute;
        left: 4px;
        /* se alinea con tu padding de inputs */
        top: -23px;
        /* que “flote” sobre el borde superior */
        font-size: 16px;
        line-height: 1;
        padding: 0 6px;
        border-radius: 4px;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity .15s ease, transform .15s ease;
        pointer-events: none;

        /* Fondo para “cortar” el borde del input; usa tu color de fondo */
        background: #161618;
        color: #FFFFFF80;
        /* similar a tu “texto-transparente” */
    }

    /* Cuando el input tiene valor o foco, mostramos el label */
    .campo.activo .label-flotante {
        opacity: 1;
        transform: translateY(0);
    }
</style>

<script>
    const inputFoto = document.getElementById('input-foto');
    const previewFoto = document.getElementById('preview-foto');
    const btnSubirFoto = document.querySelector('.btn-secundario');
    const btnSiguiente = document.querySelector('.btn-primario');

    let fotoBase64 = null;

    const MAX_BYTES = 1.5 * 1024 * 1024; // 1.5 MB
    const MAX_SIDE = 1200;              // máx. ancho/alto
    const ALLOWED_MIME = ['image/jpeg', 'image/png', 'image/webp']; // admite WebP
    const BLOCKED_EXT = ['heic', 'heif', 'tiff', 'bmp']; // los vamos a advertir

    // Subir y mostrar la imagen
    btnSubirFoto.addEventListener('click', () => inputFoto.click());

    inputFoto.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const ext = (file.name.split('.').pop() || '').toLowerCase();
        if (BLOCKED_EXT.includes(ext) || (!ALLOWED_MIME.includes(file.type) && file.type !== '')) {
            alert('Formato no soportado. Usá JPG/PNG/WebP (o convertí la foto antes de subir).');
            e.target.value = ''; // limpia selección
            return;
        }

        try {
            const processed = await compressImageFile(file, { maxSide: MAX_SIDE, maxBytes: MAX_BYTES });
            // Reemplazamos el File dentro del input, así el form manda el archivo comprimido:
            const dt = new DataTransfer();
            dt.items.add(processed);
            inputFoto.files = dt.files;

            // Preview
            const url = URL.createObjectURL(processed);
            previewFoto.innerHTML = '';
            const img = document.createElement('img');
            img.src = url;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            previewFoto.appendChild(img);
        } catch (err) {
            console.error(err);
            alert('No se pudo procesar la imagen. Probá con otra foto (JPG/PNG/WebP).');
            e.target.value = '';
        }
    });

    // Utilidad de compresión/redimensionado
    async function compressImageFile(file, { maxSide = 1200, maxBytes = 1.5 * 1024 * 1024 }) {
        // Cargamos en <img>
        const dataUrl = await fileToDataURL(file);
        const img = await dataURLToImage(dataUrl);

        // Calculamos tamaño objetivo manteniendo proporción
        let { width, height } = img;
        if (Math.max(width, height) > maxSide) {
            if (width >= height) {
                height = Math.round(height * (maxSide / width));
                width = maxSide;
            } else {
                width = Math.round(width * (maxSide / height));
                height = maxSide;
            }
        }

        // Dibujamos en canvas
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // Intentamos distintas calidades hasta quedar por debajo de maxBytes
        let quality = 0.85;
        let blob = await canvasToBlob(canvas, 'image/jpeg', quality);
        // Si el archivo fuente ya es pequeño y es PNG, podrías preservar PNG.
        // Para simplificar usamos JPEG.
        while (blob.size > maxBytes && quality > 0.5) {
            quality -= 0.05;
            blob = await canvasToBlob(canvas, 'image/jpeg', quality);
        }

        // Si ni así baja (fotos enormes), reducimos aún más dimensiones (fallback)
        let attempt = 0;
        while (blob.size > maxBytes && attempt < 3) {
            attempt++;
            const factor = 0.85; // reduce 15% cada intento
            canvas.width = Math.round(canvas.width * factor);
            canvas.height = Math.round(canvas.height * factor);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            quality = Math.max(0.6, quality); // no bajar de 0.6
            blob = await canvasToBlob(canvas, 'image/jpeg', quality);
        }

        const finalName = file.name.replace(/\.\w+$/, '') + '.jpg';
        return new File([blob], finalName, { type: 'image/jpeg', lastModified: Date.now() });
    }

    function fileToDataURL(file) {
        return new Promise((res, rej) => {
            const fr = new FileReader();
            fr.onload = () => res(fr.result);
            fr.onerror = rej;
            fr.readAsDataURL(file);
        });
    }

    function dataURLToImage(dataURL) {
        return new Promise((res, rej) => {
            const img = new Image();
            img.onload = () => res(img);
            img.onerror = rej;
            img.src = dataURL;
        });
    }

    function canvasToBlob(canvas, type, quality) {
        return new Promise((res) => canvas.toBlob((b) => res(b), type, quality));
    }


    // Validar campos en tiempo real
    function validarCampos() {
        const nombre = document.getElementById('perfil-nombre').value.trim();
        const altura = document.getElementById('perfil-altura').value.trim();

        const fecha = document.getElementById('fecha').value.trim();

        const completos = nombre !== '' && altura !== '' && fecha !== '';

        btnSiguiente.disabled = !completos;
        btnSiguiente.classList.toggle('btn-disabled', !completos);

        return completos;
    }

    btnSiguiente.addEventListener('click', (event) => {
        if (!validarCampos()) {
            event.preventDefault();  // Evita enviar si falta algo
            return;
        }

        // Guardar en localStorage (esto sigue siendo útil para los siguientes pasos)
        const nombre = document.getElementById('perfil-nombre').value.trim();
        const altura = document.getElementById('perfil-altura').value.trim();
        const fecha = document.getElementById('fecha').value.trim();

        localStorage.setItem('perfil_nombre', nombre);
        localStorage.setItem('perfil_altura', altura);
        localStorage.setItem('perfil_fecha', fecha);
    });

    // Estilos dinámicos y validación
    document.addEventListener("DOMContentLoaded", function () {
        const inputs = document.querySelectorAll('.input-text, .input-custom');
        flatpickr("#fecha", {
            altInput: true,
            altFormat: "d / M / y",
            dateFormat: "Y-m-d",
            locale: "es",
            disableMobile: true,
            maxDate: "today",
            defaultDate: document.getElementById('fecha').value || null,
            onChange: function (selectedDates, dateStr) {
                const inputShowed = document.getElementsByClassName("input-fecha-custom")[1];
                inputShowed?.classList.toggle("con-valor", !!dateStr);
            }
        });
        inputs.forEach(input => {
            if (input.value.trim() !== "") {
                input.classList.add('con-valor');
            }

            input.addEventListener("input", () => {
                input.classList.toggle('con-valor', input.value.trim() !== "");
                validarCampos();
            });
        });

        document.getElementById('fecha').addEventListener('change', validarCampos);

        // Crear labels flotantes desde el placeholder (como ya lo tenías)
        document.querySelectorAll('.campo > .input-text').forEach((input) => {
            if (!input.parentElement.querySelector('.label-flotante')) {
                const label = document.createElement('label');
                label.className = 'label-flotante';
                label.textContent = input.getAttribute('placeholder') || '';
                label.setAttribute('for', input.id || '');
                input.parentElement.prepend(label);
            }
        });

        // 👉 Sólo valor, nada de foco
        function syncCampoState(input) {
            const campo = input.closest('.campo');
            if (!campo) return;
            const tieneValor = (input.value || '').trim() !== '';
            campo.classList.toggle('activo', tieneValor);   // ← ya no depende del foco
            input.classList.toggle('con-valor', tieneValor);
        }

        // Eventos: input + cambio programático (por si autocompletado)
        document.querySelectorAll('.campo > .input-text').forEach((input) => {
            // Estado inicial
            syncCampoState(input);

            input.addEventListener('input', () => syncCampoState(input));
            input.addEventListener('change', () => syncCampoState(input));
            // (podés mantener focus/blur si querés estilos de foco, pero NO llamamos a sync por foco)
        });

        // Rechequeo por autofill del navegador
        setTimeout(() => {
            document.querySelectorAll('.campo > .input-text').forEach(syncCampoState);
        }, 150);

        // Fecha (flatpickr): mantenemos tu lógica de con-valor SOLO por valor
        const inputFechaVisible = document.getElementsByClassName("input-fecha-custom")[1];
        if (inputFechaVisible) {
            const marcarFecha = () => {
                const tiene = (inputFechaVisible.value || '').trim() !== '';
                inputFechaVisible.classList.toggle('con-valor', tiene);
            };
            inputFechaVisible.addEventListener('input', marcarFecha);
            inputFechaVisible.addEventListener('change', marcarFecha);
            setTimeout(marcarFecha, 150);
        }
    });
</script>

{% endblock %}
