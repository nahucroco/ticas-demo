<script>
    const propuestaFechas = {
        fecha1: "{{ propuesta.fecha1|date:'Y-m-d'|default:'' }}",
        fecha2: "{{ propuesta.fecha2|date:'Y-m-d'|default:'' }}",
        fecha3: "{{ propuesta.fecha3|date:'Y-m-d'|default:'' }}"
    };
</script>
<script>
    const campos = ["fecha1", "hora1", "fecha2", "hora2", "fecha3", "hora3"];
    const fechasIds = ["fecha1", "fecha2", "fecha3"];
    const horasIds = ["hora1", "hora2", "hora3"];
    let guardadoConfirmado = false;

    // Al cargar la página, restaurar (si existiera) y validar
    window.addEventListener("DOMContentLoaded", () => {
        fechasIds.forEach(id => {
            const el = document.getElementById(id);
            const valorPropuesta = propuestaFechas[id];
            const valorLS = localStorage.getItem(`partido_${id}`);
            console.log("El para", id, "es", el);

            // Dentro del forEach de fechas
            if (el && !el._flatpickr) {
                const instance = flatpickr(el, {
                    dateFormat: "Y-m-d",
                    locale: "es",
                    disableMobile: true,
                    minDate: "today",
                    defaultDate: null,
                    onChange: function (selectedDates, dateStr, instance) {
                        if (instance.input) {
                            instance.input.classList.toggle("con-valor", dateStr.trim() !== "");
                        }
                        validarCamposCompletos();
                    }
                });

                if (valorLS) {
                    instance.setDate(valorLS, true);
                    el.classList.add("con-valor");
                } else if (valorPropuesta) {
                    instance.setDate(valorPropuesta, true);
                    el.classList.add("con-valor");
                }

                console.log("SetDate ejecutado para", id, "->", valorPropuesta);
            } else {
                console.warn(`⚠️ Flatpickr ya estaba aplicado en ${id}.`);
            }

        });

        validarCamposCompletos();
    });


    // Flatpickr para horas
    horasIds.forEach(id => {
        const input = document.getElementById(id);
        const valorLS = localStorage.getItem(`partido_${id}`);
        const valorPropuesta = input?.value;  // viene desde el atributo value="{{ ... }}"

        const instanciaHora = flatpickr(`#${id}`, {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            minuteIncrement: 30,
            locale: "es",
            disableMobile: true,
            defaultDate: null,
            onChange: function (selectedDates, timeStr) {
                if (input) input.classList.toggle("con-valor", !!timeStr);
                validarCamposCompletos();
            }
        });

        if (valorLS) {
            instanciaHora.setDate(valorLS, true);
            input.classList.add("con-valor");
        } else if (valorPropuesta) {
            instanciaHora.setDate(valorPropuesta, true);
            input.classList.add("con-valor");
        }
    });


    // Validar que los 6 campos estén llenos
    function validarCamposCompletos() {
        const completos = campos.every(id => {
            const val = document.getElementById(id)?.value.trim();
            return val !== "";
        });

        const btn = document.getElementById("btn-siguiente");
        btn.disabled = !completos;
        btn.classList.toggle("btn-disabled", !completos);
    }

    // Guardar solo si se pulsa el botón "Siguiente"
    document.getElementById("btn-siguiente").addEventListener("click", () => {
        if (!document.getElementById("btn-siguiente").disabled) {
            campos.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    localStorage.setItem(`partido_${id}`, el.value.trim());
                }
            });
            guardadoConfirmado = true;
            window.location.href = "{% url 'propuesta_partido_2' partido.id %}";
        }
    });

    // Borrar si el usuario sale sin confirmar
    window.addEventListener("beforeunload", () => {
        if (!guardadoConfirmado) {
            campos.forEach(id => localStorage.removeItem(`partido_${id}`));
        }
    });
</script>
