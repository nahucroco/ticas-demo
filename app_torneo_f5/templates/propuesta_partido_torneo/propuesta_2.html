        /* Chrome, Safari, Edge */

    .container-volver {

<script>
    function actualizarEstiloSelect(selectId, inputId = null) {
        const select = $(selectId);
        const container = select.next('.select2-container');
        const valor = select.val();

        if (valor && valor.length > 0) {
            container.addClass('select-con-valor').removeClass('select-sin-valor');
        } else {
            container.addClass('select-sin-valor').removeClass('select-con-valor');
        }

        if (inputId) {
            const input = $(inputId);
            const tieneTexto = input.val().trim() !== "";

            if (tieneTexto) {
                input.addClass('input-con-valor').removeClass('input-sin-valor');
            } else {
                input.addClass('input-sin-valor').removeClass('input-con-valor');
            }
        }
    }
</script>

<script>
    function guardarEnLocalStorageYValidar() {
        const datos = {};
        let completos = true;

        for (let i = 1; i <= 2; i++) {
            const canchaSelect = document.getElementById(`select-cancha-${i}`);
            const ubicacionInput = document.getElementById(`ubicacion-cancha-${i}`);
            const precioInput = document.getElementById(`precio-${i}`);

            const canchaVal = $(canchaSelect).val();
            const ubicacionVal = ubicacionInput?.value.trim();
            const precioVal = precioInput?.value.trim();

            datos[`cancha_${i}`] = canchaVal;
            datos[`ubicacion_${i}`] = ubicacionVal;
            datos[`precio_${i}`] = precioVal;

            const canchaOK = canchaVal && canchaVal.length > 0;
            const ubicacionOK = ubicacionVal && ubicacionVal !== '';
            const precioOK = precioVal && precioVal !== '';

            if (!(canchaOK && ubicacionOK && precioOK)) {
                completos = false;
            }
        }

        localStorage.setItem("crearPartido_datosOpciones", JSON.stringify(datos));
        const boton = document.getElementById("btnProponer");
        boton.disabled = !completos;
        boton.classList.toggle("btn-deshabilitado", !completos);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const boton = document.getElementById("btnProponer");
        boton.disabled = true;

        for (let i = 1; i <= 2; i++) {
            $(`#select-cancha-${i}`).on('change', guardarEnLocalStorageYValidar);
            $(`#ubicacion-cancha-${i}`).on('input', guardarEnLocalStorageYValidar);
            $(`#precio-${i}`).on('input', guardarEnLocalStorageYValidar);
        }

        const datos = JSON.parse(localStorage.getItem("crearPartido_datosOpciones") || "{}");
        for (let i = 1; i <= 2; i++) {
            const cancha = datos[`cancha_${i}`];
            const ubicacion = datos[`ubicacion_${i}`];
            const precio = datos[`precio_${i}`];

            if (cancha) $(`#select-cancha-${i}`).val(cancha).trigger('change');
            if (ubicacion) document.getElementById(`ubicacion-cancha-${i}`).value = ubicacion;
            if (precio) document.getElementById(`precio-${i}`).value = precio;
        }

        setTimeout(guardarEnLocalStorageYValidar, 1500);
    });
</script>

<script>
    const canchaInfo = JSON.parse(document.getElementById('canchas-data').textContent);

    for (let i = 1; i <= 2; i++) {
        $(`#select-cancha-${i}`).select2({
            tags: true,
            placeholder: 'Cancha',
            maximumSelectionLength: 1,
            language: { noResults: () => "Sin resultados. Escribí para agregar." }
        });

        actualizarEstiloSelect(`#select-cancha-${i}`, `#ubicacion-cancha-${i}`);

        $(`#select-cancha-${i}`).on('change', function () {
            const selectedVal = $(this).val();
            const cancha = canchaInfo[selectedVal];
            const ubicacionInput = $(`#ubicacion-cancha-${i}`);

            if (!cancha) {
                ubicacionInput.val('').prop('readonly', false);
            } else {
                ubicacionInput.val(cancha.direccion).prop('readonly', true);
            }

            actualizarEstiloSelect(`#select-cancha-${i}`, `#ubicacion-cancha-${i}`);
            guardarEnLocalStorageYValidar();
        });

        $(`#ubicacion-cancha-${i}`).on('input', () => {
            actualizarEstiloSelect(`#select-cancha-${i}`, `#ubicacion-cancha-${i}`);
        });

        const inputPrecio = document.getElementById(`precio-${i}`);
        const wrapper = inputPrecio?.closest(".input-precio-wrapper");

        inputPrecio?.addEventListener("input", () => {
            let valor = inputPrecio.value.replace(/\D/g, '');
            if (valor.length === 0) {
                inputPrecio.value = "";
                wrapper?.classList.remove("input-con-valor");
                wrapper?.classList.add("input-sin-valor");
            } else {
                inputPrecio.value = parseInt(valor, 10).toLocaleString('es-AR');
                wrapper?.classList.add("input-con-valor");
                wrapper?.classList.remove("input-sin-valor");
            }
        });
    }
</script>



<script>
    window.addEventListener('load', () => {
        document.documentElement.classList.remove('sin-estilos');
    });
</script>

<script>
    document.getElementById("btnProponer").addEventListener("click", async () => {
        const datosPaso1 = {
            fecha1: localStorage.getItem("partido_fecha1"),
            hora1: localStorage.getItem("partido_hora1"),
            fecha2: localStorage.getItem("partido_fecha2"),
            hora2: localStorage.getItem("partido_hora2"),
            fecha3: localStorage.getItem("partido_fecha3"),
            hora3: localStorage.getItem("partido_hora3"),
        };

        const datosPaso2 = JSON.parse(localStorage.getItem("crearPartido_datosOpciones") || "{}");

        const partidoId = document.getElementById("btnProponer").dataset.partidoId;

        const payload = {
            ...datosPaso1,
            cancha1: datosPaso2.cancha_1?.[0] || null,
            ubicacion1: datosPaso2.ubicacion_1,
            precio1: datosPaso2.precio_1?.replace(/\D/g, '') || null,
            cancha2: datosPaso2.cancha_2?.[0] || null,
            ubicacion2: datosPaso2.ubicacion_2,
            precio2: datosPaso2.precio_2?.replace(/\D/g, '') || null,
            partido_id: partidoId,
        };

        try {
            const res = await fetch("{% url 'crear_propuesta' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                },
                body: JSON.stringify(payload)
            });

            const resultado = await res.json();

            if (resultado.success) {
                alert("¡Propuesta creada con éxito!");
                window.location.href = "{% url 'detalle_propuesta' partido.id %}";
            } else {
                alert("Error al crear la propuesta.");
            }
        } catch (error) {
            console.error("Error en la solicitud:", error);
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    });
</script>
