   height: 0;

   top: 3px;
   width: 5px;
   height: 10px;
   border: solid #161618;

<script>
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    const cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.startsWith(name + "=")) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>

<script>
   document.addEventListener("DOMContentLoaded", () => {
   
     /* ============================================================
        1) STEPPER (HEADER DE CARGA)
     ============================================================ */
   
     const stepIcons  = document.querySelectorAll(".step-icon");
     const stepLabels = document.querySelectorAll(".step-label");
   const btnSiguiente = document.querySelector(".footer-penales-nav .btn-primario:last-child");
   
    let pasoActual = 1;

    function mostrarPaso(paso) {
      pasoActual = paso;

      // Mostrar / ocultar secciones
      document.querySelectorAll(".team-section").forEach(section => {
        const step = Number(section.getAttribute("step"));
        section.style.display = step === paso ? "block" : "none";
      });

      // Header (iconos y labels)
      document.querySelectorAll(".step-icon").forEach(icon => {
        icon.classList.toggle("active", Number(icon.dataset.step) === paso);
      });

      document.querySelectorAll(".step-label").forEach(label => {
        label.classList.toggle("active", Number(label.dataset.step) === paso);
      });
    }

   
   // estado inicial
   mostrarPaso(1);

   
   btnSiguiente?.addEventListener("click", () => {
   if (pasoActual === 1) {
    const icon = document.querySelector('.step-icon[data-step="1"]');
    icon?.classList.add("transitioning");
   
    setTimeout(() => mostrarPaso(2), 250);
   } else {
    // paso 2 → acá después mandás al backend
    //boton anterior aparece
    
    
    console.log("Paso 2 → submit final");
   }
   });
   
     /* ============================================================
        2) EXPANDIR / CONTRAER TARJETA DE JUGADORES
     ============================================================ */
   
     document.querySelectorAll(".player-card").forEach(card => {
       card.addEventListener("click", () => {
         card.classList.toggle("expanded");
       });
     });
   
   
     /* ============================================================
        3) CONTADORES GENÉRICOS data-counter
     ============================================================ */
   
     document.querySelectorAll("[data-counter]").forEach(counter => {
       const valueEl = counter.querySelector("[data-value]");
       const plus = counter.querySelector("[data-plus]");
       const minus = counter.querySelector("[data-minus]");
   
       let value = parseInt(valueEl.textContent || "0", 10);
   
       plus?.addEventListener("click", e => {
         e.stopPropagation();
         value++;
         valueEl.textContent = value;
       });
   
       minus?.addEventListener("click", e => {
         e.stopPropagation();
         if (value > 0) value--;
         valueEl.textContent = value;
       });
     });
   
   
     /* ============================================================
        4) CONTADORES DE ESTADÍSTICAS (stat-counter)
     ============================================================ */
   
     document.querySelectorAll(".stat-counter").forEach(counter => {
   
       const valueEl = counter.querySelector(".stat-value");
       const btnPlus = counter.querySelector(".btn-plus");
       const btnMinus = counter.querySelector(".btn-minus");
   
       let value = parseInt(valueEl.textContent || "0", 10);
       const min = parseInt(counter.dataset.min ?? "0", 10);
   
       function syncUI() {
         valueEl.textContent = value;
   
         btnMinus.classList.toggle("is-disabled", value <= min);
       }
   
       btnPlus?.addEventListener("click", e => {
         e.stopPropagation();
         value++;
         syncUI();
       });
   
       btnMinus?.addEventListener("click", e => {
         e.stopPropagation();
         if (value > min) {
           value--;
           syncUI();
         }
       });
   
       syncUI();
     });
   
   
     /* ============================================================
        5) BTN VOLVER MOBILE EN NAVBAR
     ============================================================ */
   
     const originalBtn = document.querySelector(".navbar-toggler");
     if (originalBtn) {
       const backBtn = document.createElement("button");

       backBtn.className = "navbar-toggler btn-volver-mobile";
       backBtn.innerHTML = `

<script>

     const url = `/api/partido/${tipo}/${partidoId}/cargar-estadisticas/`;

     fetch(url, {
       method: "GET",
       headers: {
         "Accept": "application/json",
       },
       credentials: "include",
     })
       .then(response => {
         if (!response.ok) {
           throw new Error(`HTTP ${response.status}`);

         return response.json();

   function initCountersWithin(root) {
     root.querySelectorAll(".stat-counter").forEach(counter => {
       const valueEl = counter.querySelector(".stat-value");
       const btnPlus = counter.querySelector(".btn-plus");
       const btnMinus = counter.querySelector(".btn-minus");
   
       let value = parseInt(valueEl.textContent || "0", 10);
       const min = parseInt(counter.dataset.min ?? "0", 10);
   
       const syncUI = () => {
         valueEl.textContent = value;
         btnMinus.classList.toggle("is-disabled", value <= min);
       };
   
       btnPlus?.addEventListener("click", e => {
         e.stopPropagation();
         value++;
         syncUI();
       });
   
       btnMinus?.addEventListener("click", e => {
         e.stopPropagation();
         if (value > min) value--;
         syncUI();
       });
   
       syncUI();
     });
   }
   
   function syncTandaPenalesInCard(card) {
   const stats = card.querySelector(".player-stats");
   if (!stats) return;
   
   const checkboxPenales = document.getElementById("checkbox-penales");
   let tanda = stats.querySelector(".tanda-penales");
   
   if (checkboxPenales?.checked) {
     if (!tanda) {
       tanda = document.createElement("div");
       tanda.className = "tanda-penales";
       tanda.innerHTML = `
         <span class="M-body-Sm">Tanda de penales</span>
         <div class="stroke-linecap"></div>
       `;
   
       // ✅ CREAR y GUARDAR la fila
       const row = makeStatRow({
         label: "Goles",
         iconSvg: ICON_PENALES,
         statKey: "gol_penales",
         initial: 0
       });
   
       tanda.appendChild(row);
       stats.appendChild(tanda);
   
       // ✅ inicializar botones + / -
       initCountersWithin(tanda);
     }
   
     tanda.classList.add("is-visible");
   } else {
     if (tanda) tanda.classList.remove("is-visible");
   }
   }

     const card = document.createElement("article");
     card.className = "player-card";

     card.dataset.team = teamKey; // ✅ A o B
   
   
     // header
     card.innerHTML = `

         <div class="player-info">
           <div class="player-avatar">

         <button class="player-toggle" type="button">

             <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
               <path d="M5 9L12 15L19 9" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
             </svg>
           </span>
           <span class="icon-open toggle-icon">
             <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
               <path d="M5 15L12 9L19 15" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
             </svg>
           </span>
         </button>
       </div>
   
       <div class="player-stats"></div>
     `;
   
     const stats = card.querySelector(".player-stats");
       stats.appendChild(
         makeStatRow({
           label: "Goles",
           iconSvg: ICON_GOLES,
           statKey: "goles_comunes"
         })
       );
       
     stats.appendChild(
       makeStatRow({
         label: "Asistencias",
         iconSvg: ICON_ASIST,
         statKey: "asistencias"
       })
     );
   
     // expand/collapse SOLO con el botón (así no se dispara tocando contadores)
     const toggleBtn = card.querySelector(".player-toggle");
     toggleBtn.addEventListener("click", (e) => {
       e.stopPropagation();
       card.classList.toggle("expanded");
     });
   
     // inicializa contadores dentro de esta card
     initCountersWithin(card);
   
     // penales
     syncTandaPenalesInCard(card);
   
     return card;
   }
   
   function renderEquipo({ teamSelector, teamName, jugadores, teamKey , teamID}) {
     const team = document.querySelector(teamSelector);
     if (!team) return;
   
     const nameEl = team.querySelector(".team-name");
       // 🔑 GUARDAR IDS SEGÚN EQUIPO
      if (teamKey === "a") {
        EQUIPO_A_ID = teamID;
      }

      if (teamKey === "b") {
        EQUIPO_B_ID = teamID;
      }

      console.log(`🆔 Equipo ${teamKey.toUpperCase()} ID:`, teamID);
      


     const container = team.querySelector(".players-container");
     if (!nameEl || !container) return;
   
     nameEl.textContent = teamName || "";
     container.innerHTML = "";
   
     jugadores.forEach(j => {
       container.appendChild(createPlayerCard(j, teamKey));
     });
   }
   
   // checkbox penales global: aplica a todas las cards ya pintadas
   checkboxPenales?.addEventListener("change", () => {
     document.querySelectorAll(".player-card").forEach(card => syncTandaPenalesInCard(card));
   });
   
   // === FETCH ===
   const pathParts = window.location.pathname.split("/");
   const tipo = pathParts[2];

   })

<script>
let pasoActual = 1; // 1 = participaciones | 2 = tarjetas

document.addEventListener("DOMContentLoaded", () => {

  const btnSiguiente = document.querySelector(".footer-penales-nav .btn-primario");
  const btnVolver = document.querySelector(".footer-penales-nav .btn-secundario");
  const checkboxPenales = document.getElementById("checkbox-penales");

  /* =====================================================
     MOSTRAR PASO
  ===================================================== */
  function mostrarPaso(paso) {
    pasoActual = paso;

    // mostrar / ocultar secciones
    document.querySelectorAll(".team-section").forEach(section => {
      const step = Number(section.getAttribute("step"));
      section.style.display = step === paso ? "block" : "none";
    });

    // header icons
    document.querySelectorAll(".step-icon").forEach(icon => {
      icon.classList.toggle("active", Number(icon.dataset.step) === paso);
    });

    document.querySelectorAll(".step-label").forEach(label => {
      label.classList.toggle("active", Number(label.dataset.step) === paso);
    });
  }

  function getTarjetasFromCard(card) {
  const chkAmarilla = card.querySelector(".chk-amarilla");
  const chkRoja = card.querySelector(".chk-roja");

  return {
    tarjetas_amarillas: chkAmarilla?.checked ? 1 : 0,
    tarjeta_roja: chkRoja?.checked ? true : false
  };
}
//const id footer-penales-check

const footerPenalesCheck = document.getElementById("footer-penales-check");

  // estado inicial
  mostrarPaso(1);
  btnVolver.style.opacity = "0";


  /* =====================================================
     BOTÓN SIGUIENTE
  ===================================================== */
  btnSiguiente?.addEventListener("click", () => {

    // 👉 STEP 1 → STEP 2
    if (pasoActual === 1) {

      statsStep1 = {};

      document
        .querySelectorAll("#team-a .player-card, #team-b .player-card")
        .forEach(card => {

          const id = parseInt(card.dataset.jugadorId, 10);
          if (!id) return;

          statsStep1[id] = {
            goles_comunes: getStatByKey(card, "goles_comunes"),
            gol_penales: checkboxPenales?.checked
              ? getStatByKey(card, "gol_penales")
              : 0,
            asistencias: getStatByKey(card, "asistencias"),
          };
        });

      mostrarPaso(2);
      btnVolver.style.opacity = "1";
      footerPenalesCheck.style.display = "none";

      
      return;
    }

    // 👉 STEP 2 → GUARDAR PAYLOAD (TU LÓGICA)
    if (pasoActual === 2) {

      const parts = window.location.pathname.split("/");
      const partidoId = parseInt(parts[3], 10);

      const payload = {
        partido_id: partidoId,
        hubo_tanda_penales: !!checkboxPenales?.checked,
        equipo_a_id: null,
        equipo_b_id: null,
        estadisticas: []
      };

      let golesA = 0;
      let golesB = 0;
      let penalesA = 0;
      let penalesB = 0;

      document
        .querySelectorAll("#team-a-step-2 .player-card, #team-b-step-2 .player-card")
        .forEach(card => {

          const id = parseInt(card.dataset.jugadorId, 10);
          if (!id) return;

          const { tarjetas_amarillas, tarjeta_roja } = getTarjetasFromCard(card);
          const base = statsStep1[id] || {};

          payload.estadisticas.push({
            miembro_equipo: id,

            goles_comunes: base.goles_comunes ?? 0,
            gol_penales: base.gol_penales ?? 0,
            goles: (base.goles_comunes ?? 0) + (base.gol_penales ?? 0),
            asistencias: base.asistencias ?? 0,

            tarjetas_amarillas,
            tarjeta_roja,

            faltas: 0,
            atajadas: 0,
            autogoles: 0,
            tiros_arco: 0,
            jugo: true
          });
        });

      localStorage.setItem("estadisticas_partido", JSON.stringify(payload));
      console.log("💾 Payload guardado:", payload);

      //reireccionar al partido
/*       window.location.href = `/partido/torneo/${partidoId}/`;
 */
      // mandar el payload a la API

         

    fetch("/api/partido/torneo/" + partidoId + "/cargar-estadisticas/final/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCookie("csrftoken"),
      },
      body: JSON.stringify(payload),
    })
      .then(resp => resp.json())
      .then(data => {
        console.log("✅ Estadisticas cargadas:", data);

        // 👉 redireccionar al partido
       window.location.href = `/partido/torneo/${partidoId}/`;
      });



      
    }
  });

  /* =====================================================
     BOTÓN VOLVER
  ===================================================== */
  btnVolver?.addEventListener("click", () => {
    mostrarPaso(1);
    btnVolver.style.opacity = "0";
    footerPenalesCheck.style.display = "flex";
  });

});
</script>
