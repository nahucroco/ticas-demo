{% extends 'app_torneo_f5/base.html' %}
{% load static %}
{% block head %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/varcolors.css' %}">
<link rel="stylesheet" href="{% static 'css/busqueda.css' %}">
{% endblock %}
{% block title %}Ticas - Búsqueda{% endblock %}
{% block content %}

<form id="form-busqueda" autocomplete="off">
  <div class="search-container">
    <span class="search-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g opacity="0.5">
          <path d="M11.5 21C16.7467 21 21 16.7467 21 11.5C21 6.25329 16.7467 2 11.5 2C6.25329 2 2 6.25329 2 11.5C2 16.7467 6.25329 21 11.5 21Z" stroke="white" stroke-width="1.5"/>
          <path d="M18.5 18.5L22 22" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </svg>
    </span>
    <input type="text" name="q" placeholder="Busca jugador, equipo, torneo..." class="search-input">
  </div>
</form>

<div class="busqueda-container-enter">
  <div class="tab-selector">
    <button class="tab active" data-tab="jugadores">Jugadores</button>
    <button class="tab" data-tab="equipos">Equipos</button>
    <button class="tab" data-tab="torneos">Torneos</button>
  </div>
  <div class="error-busqueda"></div>
  <div id="resultados-api" class="busqueda-container-recientes"></div>
</div>

<div class="busqueda-container-recientesx">
  <div class="busqueda-items">
    <p class="recientes-label">Búsquedas recientes</p>
    <!-- Se insertan desde localStorage -->
  </div>
</div>


<footer class="footer-busqueda">
  <div class="borrar-historial">
    <a href="#" id="borrarHistorial"><span>Borrar historial</span></a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{% static '/js/busqueda.js' %}"></script>


{% endblock %}
