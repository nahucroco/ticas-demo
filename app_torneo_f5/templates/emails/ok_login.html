<html>

    <h2>¡Hola {{ user.first_name|default:user.username }}!</h2>

    <p>
      <a href="{{ ok_url }}" 
         style="display:inline-block;background:#22c55e;color:#fff;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:600;">
