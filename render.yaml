# Blueprint de Render para la demo. La base es SQLite dentro del contenedor: se vuelve a
# cargar con datos ficticios en cada despliegue o reinicio.
services:
  - type: web
    name: ticas-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py cargar_demo && gunicorn proyecto_torneo_f5.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /login/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SECRET_KEY
        generateValue: true
